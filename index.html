<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="js.js" defer></script>
</head>
<body>
    <div class="container">
        <section class="grid-container" id="display">
            <section class="column-head">
                <h2>Title</h2>
                <h2>Author</h2>
                <h2>Genre</h2>
                <h2>Pages</h2>
                <h2>Read</h2>
            </section>
            <section class="book">
                <p>The Hobbit</p>
                <p>J.R.R. Tolkien</p>
                <p>Fantasy</p>
                <p>310</p>
                <p>Yes</p>
            </section>
            <section class="book">
                <p>Dune</p>
                <p>Frank Herbert</p>
                <p>Sci-Fi</p>
                <p>412</p>
                <p>No</p>
            </section>
        </section>
        <button type="button" class="btn-add-book" id="btn-add-book">+New Book</button>
    </div>
</body>
</html>
