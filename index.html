<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="js.js" defer></script>
</head>
<body>
    <div class="container">
        <section class="grid-container" id="display">
            <section class="column-head">
                <h2>Title</h2>
                <h2>Author</h2>
                <h2>Genre</h2>
                <h2>Pages</h2>
                <h2>Read</h2>
            </section>
        </section>

        <button type="button" class="btn-add-book" id="btn-add-book">+New Book</button>
        <dialog id="add-book-input">
            <div class="modal-content">
                <h2>Add new book</h2>
                <form>
                    <fieldset>
                        <div>
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title" required>
                        </div>
                        <div>
                            <label for="author">Author</label>
                            <input type="text" id="author" name="author" required\>
                        </div>
                        <div>
                            <label for="genre">Genre</label>
                            <input type="text" id="genre" name="genre" required\>
                        </div>
                          <div>
                            <label for="pages">Pages</label>
                            <input type="number" id="pages" name="pages" min="1" step="1" required\>
                        </div>
                        <div>
                            <label for="read-book">Did you read the book?</label>
                            <select name="read" id="read-book" required>
                                <option value="" disabled selected hidden>Please select...</option>
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                    </fieldset>
                    <div>
                        <button class="btn-cancel" type="button" value="cancel" id="add-book-input-cancel" formmethod="dialog">Cancel</button>
                        <button class="btn-add" type="submit" value="default" id="add-book-input-submit" disabled>Add</button>
                    </div>
                </form>
            </div>
        </dialog>

    </div>
</body>
</html>
